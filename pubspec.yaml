name: ucuzgetir_app
description: "UcuzGetir native shopping app."
publish_to: 'none'

version: 1.0.2+24

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  xml: ^7.1.0
  shared_preferences: ^2.5.6
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21